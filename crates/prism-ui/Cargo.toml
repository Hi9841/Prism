[package]
name = "prism-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
# `src/lib/` mirrors Prism's `src/lib/` (RULEBOOK §4), so the crate root cannot be `src/lib.rs`.
path = "src/prism_ui.rs"

[features]
default = ["gpui"]
# Views, entities, and the theme. The pure logic builds without it (the judge adapter).
gpui = ["dep:gpui"]

[dependencies]
gpui = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
regex = "1"
ryu-js = "1"
icu_collator = "2"
icu_locale_core = "2"
sys-locale = "0.3"
