<!doctype html>
<meta charset="utf-8">
<title>Prism Step 2 headless baseline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #list { height: 572px; overflow: auto; width: 400px; }
  .h { height: 28px; } .r { height: 44px; }
</style>
<div id="list"></div>
<pre id="out"></pre>
<script>
try {
  // Same layout as the GPUI spike: header 28 px, 4 file rows, header, 20 app rows, header, 175 rows.
  const list = document.getElementById("list");
  const heights = [];
  for (const count of [4, 20, 175]) {
    heights.push(28);
    for (let i = 0; i < count; i++) heights.push(44);
  }
  for (const h of heights) {
    const d = document.createElement("div");
    d.className = h === 28 ? "h" : "r";
    list.appendChild(d);
  }
  const rows = [...list.children];
  const top = (ix) => heights.slice(0, ix).reduce((a, b) => a + b, 0);
  const r = {};
  r.reduced_motion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  r.language = navigator.language;
  r.languages = navigator.languages;
  r.ua = navigator.userAgent;

  // Row 116 baseline: the GPUI spike's edge case. Scroll top = item 2 + 5 px;
  // find a fully visible row whose bottom gap is between 0 and 5 px.
  let start = -1, j = -1;
  search: for (let k = 2; k < 40; k++) for (let o = 1; o < heights[k]; o++) {
    const st = top(k) + o;
    for (let ix = k + 1; ix < k + 30; ix++) {
      const gap = st + 572 - (top(ix) + heights[ix]);
      if (top(ix) >= st && gap > 0 && gap < o) { start = st; j = ix; break search; }
    }
  }
  list.scrollTop = start;
  rows[j].scrollIntoView({ block: "nearest" });
  r.visible_row = { ix: j, gap: start + 572 - (top(j) + heights[j]), scroll_before: start, scroll_after: list.scrollTop };
  list.scrollTop = start;
  rows[j + 6].scrollIntoView({ block: "nearest" });
  r.below_row = { ix: j + 6, scroll_after: list.scrollTop, bottom_gap: list.scrollTop + 572 - (top(j + 6) + heights[j + 6]) };
  list.scrollTop = start;
  rows[1].scrollIntoView({ block: "nearest" });
  r.above_row = { ix: 1, scroll_after: list.scrollTop, row_top: top(1) };
  document.getElementById("out").textContent = "RESULT " + JSON.stringify(r);
} catch (e) { document.getElementById("out").textContent = "ERROR " + e.stack; }
</script>
