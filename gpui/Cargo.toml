[workspace]
resolver = "2"
members = ["crates/prism-app", "crates/prism-ui", "crates/prism-judge"]

[workspace.package]
edition = "2024"
version = "1.0.8"
publish = false

[workspace.dependencies]
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gpui 0.2.2 with the patches listed in vendor/gpui/PRISM-PATCHES.md.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

# The installed binary: no symbol tables, cross-crate inlining (thin LTO).
[profile.release]
strip = true
lto = "thin"
