<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue #32 - IssueAgent</title>
  <style>
    :root {
      --canvas: #f4f5f4;
      --surface: #ffffff;
      --ink: #181b19;
      --muted: #6f7672;
      --line: #dedfdf;
      --line-soft: #e7e9e7;
      --action: #216e55;
      --action-hover: #185a45;
      --info: #2d67a3;
      --info-bg: #edf4fa;
      --warning: #9a650d;
      --danger: #a94040;
      --danger-bg: #fdf2f2;
      --success: #216e55;
      --success-bg: #edf7f3;
      --selected: #f1f4f2;
      --badge: #ecefed;
      --badge-ink: #59615d;
      --body-ink: #39413d;
      --body-ink-strong: #252a27;
      --radius-control: 6px;
      --radius-panel: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: var(--canvas);
      color: var(--ink);
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      max-width: 1040px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .issue-info h1 {
      font-size: 20px;
      font-weight: 650;
      color: var(--body-ink-strong);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .issue-meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .issue-meta a {
      color: var(--info);
      text-decoration: none;
    }
    .issue-meta a:hover { text-decoration: underline; }
    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--success);
      background: var(--success-bg);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .connection-status.reconnecting {
      color: var(--warning);
      background: #fdf8ed;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
    }
    @media (max-width: 840px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    .stages-panel, .activity-panel, .guidance-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      padding: 18px;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--body-ink-strong);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stages-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stage-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: var(--radius-control);
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      background: var(--canvas);
    }
    .stage-item.completed {
      color: var(--success);
      background: var(--success-bg);
    }
    .stage-item.active {
      color: var(--info);
      background: var(--info-bg);
      font-weight: 600;
    }
    .stage-item.blocked {
      color: var(--danger);
      background: var(--danger-bg);
    }
    .stage-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      background: var(--line);
      color: var(--body-ink);
    }
    .stage-item.completed .stage-num {
      background: var(--success);
      color: #fff;
    }
    .stage-item.active .stage-num {
      background: var(--info);
      color: #fff;
    }
    .stage-name { flex: 1; text-transform: capitalize; }
    .stage-tag {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .banner {
      padding: 12px 14px;
      border-radius: var(--radius-control);
      margin-bottom: 16px;
      font-size: 13.5px;
    }
    .banner.active { background: var(--info-bg); color: var(--info); border: 1px solid #c9def0; }
    .banner.completed { background: var(--success-bg); color: var(--success); border: 1px solid #bce4d6; }
    .banner.blocked { background: var(--danger-bg); color: var(--danger); border: 1px solid #f2c7c7; }
    .activity-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .activity-row {
      padding: 10px 12px;
      border-radius: var(--radius-control);
      background: var(--canvas);
      border: 1px solid var(--line-soft);
      font-size: 13px;
    }
    .activity-header {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }
    .activity-message {
      color: var(--body-ink-strong);
      font-weight: 500;
    }
    .activity-detail {
      margin-top: 6px;
      padding: 6px 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      color: var(--body-ink);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .guidance-section {
      margin-top: 20px;
    }
    .guidance-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: var(--radius-control);
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 13.5px;
      resize: vertical;
      min-height: 70px;
      outline: none;
    }
    textarea:focus {
      border-color: var(--info);
      box-shadow: 0 0 0 2px rgba(45,103,163,0.15);
    }
    button.btn-primary {
      align-self: flex-start;
      background: var(--action);
      color: #fff;
      border: none;
      border-radius: var(--radius-control);
      padding: 8px 16px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      min-height: 38px;
    }
    button.btn-primary:hover {
      background: var(--action-hover);
    }
    .guidance-history {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .guidance-item {
      padding: 8px 10px;
      background: var(--canvas);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-control);
      font-size: 12.5px;
    }
    .guidance-status-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
    }
    .guidance-status-pending { background: #fdf8ed; color: var(--warning); }
    .guidance-status-read { background: var(--info-bg); color: var(--info); }
    .guidance-status-applied { background: var(--success-bg); color: var(--success); }
    .guidance-status-declined { background: var(--danger-bg); color: var(--danger); }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="issue-info">
        <h1 id="issue-title">Issue #32: Add &#x27;Open location&#x27; to right-click context menu for files and folders</h1>
        <div class="issue-meta">
          Repo: <strong>Hi9841/Prism</strong> · <a id="issue-link" href="https://github.com/Hi9841/Prism/issues/32" target="_blank" rel="noopener">View on GitHub ↗</a>
        </div>
      </div>
      <div id="conn-status" class="connection-status">
        <span class="dot"></span>
        <span id="conn-label">Live</span>
      </div>
    </header>

    <div class="main-grid">
      <div class="stages-panel">
        <div class="panel-title">Workflow Stages</div>
        <div class="stages-list" id="stages-list"></div>
      </div>

      <div class="content-column">
        <div class="activity-panel">
          <div id="active-banner" class="banner active" style="display: none;"></div>
          <div class="panel-title">Activity Feed</div>
          <div class="activity-feed" id="activity-feed"></div>

          <div class="guidance-section">
            <div class="panel-title" style="margin-top: 20px;">Human Guidance Channel</div>
            <p style="font-size: 12.5px; color: var(--muted);">Send feedback or directives to the agent. Messages are claimed at workflow boundaries.</p>
            <form class="guidance-form" id="guidance-form">
              <textarea id="guidance-input" placeholder="Type guidance or instructions for the agent..."></textarea>
              <button type="submit" class="btn-primary">Send Guidance</button>
            </form>
            <div class="guidance-history" id="guidance-history"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let state = {"issue": {"number": 32, "title": "Add 'Open location' to right-click context menu for files and folders", "repo": "Hi9841/Prism", "url": "https://github.com/Hi9841/Prism/issues/32"}, "stages": {"triage": {"status": "completed", "message": "Triage completed for issue #32", "updated_at": "23:46:44"}, "research": {"status": "completed", "message": "Codebase research completed", "updated_at": "23:46:56"}, "prompt": {"status": "completed", "message": "Task prompt generated at prompts/issue_32_fix_prompt.md", "updated_at": "23:47:11"}, "debug": {"status": "completed", "message": "Surgical implementation complete across frontend and backend", "updated_at": "23:50:16"}, "tests": {"status": "completed", "message": "Automated test gate passed (110 vitest tests + 138 Rust tests)", "updated_at": "23:50:20"}, "review": {"status": "completed", "message": "Independent code review passed (Verdict: PASS)", "updated_at": "23:52:56"}, "pr": {"status": "completed", "message": "Pull request created successfully", "updated_at": "23:53:46"}}, "activity": [{"stage": "triage", "status": "completed", "message": "Triage completed for issue #32", "detail": "Issue created: https://github.com/Hi9841/Prism/issues/32", "timestamp": "23:46:44"}, {"stage": "research", "status": "active", "message": "Conducting in-depth codebase research across frontend and backend", "detail": "Inspecting ResultContextMenu.tsx, Palette.tsx, bridge.ts, sections.ts, types.ts, src-tauri/src/lib.rs, and src-tauri/src/apps.rs", "timestamp": "23:46:48"}, {"stage": "research", "status": "completed", "message": "Codebase research completed", "detail": "Identified 7 key files to modify across frontend and Rust backend.", "timestamp": "23:46:56"}, {"stage": "prompt", "status": "active", "message": "Generating in-depth task prompt for Issue #32", "detail": "Writing prompts/issue_32_fix_prompt.md", "timestamp": "23:47:00"}, {"stage": "prompt", "status": "completed", "message": "Task prompt generated at prompts/issue_32_fix_prompt.md", "detail": "prompts/issue_32_fix_prompt.md", "timestamp": "23:47:11"}, {"stage": "debug", "status": "active", "message": "Branch fix/issue-32-open-location checked out. Implementing surgical changes across Rust backend and React frontend.", "detail": "", "timestamp": "23:47:20"}, {"stage": "debug", "status": "completed", "message": "Surgical implementation complete across frontend and backend", "detail": "Added open_path_location to apps.rs and lib.rs, openPathLocation to bridge.ts, openLocation to types.ts and sections.ts, and updated ResultContextMenu and Palette.tsx", "timestamp": "23:50:16"}, {"stage": "tests", "status": "completed", "message": "Automated test gate passed (110 vitest tests + 138 Rust tests)", "detail": "bun x vitest run: 110 passed; cargo test: 138 passed", "timestamp": "23:50:20"}, {"stage": "review", "status": "active", "message": "Spawning independent code review subagent", "detail": "", "timestamp": "23:50:25"}, {"stage": "review", "status": "completed", "message": "Independent code review passed (Verdict: PASS)", "detail": "Verified acceptance criteria, keyboard accessibility, boundary safety, and zero bloat.", "timestamp": "23:52:56"}], "guidance": [], "branch": "fix/issue-32-open-location", "pr_url": "https://github.com/Hi9841/Prism/pull/33", "status": "completed"};

    function render(s) {
      state = s;
      document.getElementById('issue-title').textContent = `Issue #${s.issue.number}: ${s.issue.title}`;
      document.getElementById('issue-link').href = s.issue.url || '#';

      // Render stages
      const stagesList = document.getElementById('stages-list');
      stagesList.innerHTML = '';
      const stageKeys = ['triage', 'research', 'prompt', 'debug', 'tests', 'review', 'pr'];
      stageKeys.forEach((key, idx) => {
        const stageInfo = s.stages[key] || { status: 'pending', message: '' };
        const item = document.createElement('div');
        item.className = `stage-item ${stageInfo.status}`;
        item.innerHTML = `
          <div class="stage-num">${idx + 1}</div>
          <div class="stage-name">${key}</div>
          <div class="stage-tag">${stageInfo.status}</div>
        `;
        stagesList.appendChild(item);
      });

      // Active banner
      const banner = document.getElementById('active-banner');
      const activeStage = stageKeys.find(k => s.stages[k] && s.stages[k].status === 'active');
      if (s.status === 'completed') {
        banner.style.display = 'block';
        banner.className = 'banner completed';
        banner.innerHTML = `<strong>Workflow Completed!</strong> ${s.pr_url ? `<br><a href="${s.pr_url}" target="_blank">View Pull Request ↗</a>` : ''}`;
      } else if (activeStage) {
        banner.style.display = 'block';
        banner.className = 'banner active';
        banner.innerHTML = `<strong>Active Stage: ${activeStage.toUpperCase()}</strong> · ${s.stages[activeStage].message || 'In progress...'}`;
      } else {
        banner.style.display = 'none';
      }

      // Render activity feed
      const activityFeed = document.getElementById('activity-feed');
      activityFeed.innerHTML = '';
      if (!s.activity || s.activity.length === 0) {
        activityFeed.innerHTML = '<p style="font-size: 13px; color: var(--muted);">No activity recorded yet.</p>';
      } else {
        s.activity.slice().reverse().forEach(act => {
          const row = document.createElement('div');
          row.className = 'activity-row';
          row.innerHTML = `
            <div class="activity-header">
              <span><strong>${act.stage.toUpperCase()}</strong> [${act.status}]</span>
              <span>${act.timestamp || ''}</span>
            </div>
            <div class="activity-message">${escapeHtml(act.message)}</div>
            ${act.detail ? `<div class="activity-detail">${escapeHtml(act.detail)}</div>` : ''}
          `;
          activityFeed.appendChild(row);
        });
      }

      // Render guidance history
      const guidanceList = document.getElementById('guidance-history');
      guidanceList.innerHTML = '';
      if (s.guidance && s.guidance.length > 0) {
        s.guidance.slice().reverse().forEach(g => {
          const item = document.createElement('div');
          item.className = 'guidance-item';
          item.innerHTML = `
            <span class="guidance-status-badge guidance-status-${g.status}">${g.status.toUpperCase()}</span>
            <div>${escapeHtml(g.text)}</div>
            ${g.response ? `<div style="margin-top: 4px; color: var(--muted); font-size: 12px;">↳ Agent: ${escapeHtml(g.response)}</div>` : ''}
          `;
          guidanceList.appendChild(item);
        });
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    render(state);

    // Setup SSE connection
    function connectSSE() {
      const connLabel = document.getElementById('conn-label');
      const connStatus = document.getElementById('conn-status');
      const evtSource = new EventSource('/events');

      evtSource.onopen = () => {
        connLabel.textContent = 'Live';
        connStatus.className = 'connection-status';
      };

      evtSource.onmessage = (e) => {
        try {
          const newState = JSON.parse(e.data);
          render(newState);
        } catch (err) {
          console.error('SSE parse error:', err);
        }
      };

      evtSource.onerror = () => {
        connLabel.textContent = 'Reconnecting';
        connStatus.className = 'connection-status reconnecting';
      };
    }

    connectSSE();

    // Guidance submission
    document.getElementById('guidance-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('guidance-input');
      const text = input.value.trim();
      if (!text) return;

      try {
        const res = await fetch('/api/guidance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (res.ok) {
          input.value = '';
          const updatedState = await res.json();
          render(updatedState);
        }
      } catch (err) {
        alert('Failed to send guidance: ' + err.message);
      }
    });
  </script>
</body>
</html>
