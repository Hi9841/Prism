name: Release Prism

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  authorize:
    name: Check the owner review and version bump
    if: github.event.pull_request.merged && github.event.pull_request.merged_by.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      tag: ${{ steps.review.outputs.tag }}
    steps:
      - name: Check the final PR commit and the version it adds
        id: review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          $pr = "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER"
          $reviews = gh api --paginate "$pr/reviews" --jq '.[] | @json'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the PR reviews.' }
          $review = $reviews | ForEach-Object { ConvertFrom-Json -InputObject $_ } |
            Where-Object { $_.user.login -eq $env:REPOSITORY_OWNER -and $_.state -in @('APPROVED', 'CHANGES_REQUESTED', 'DISMISSED') } |
            Select-Object -Last 1
          if ($null -eq $review -or $review.state -ne 'APPROVED' -or $review.commit_id -ne $env:PR_HEAD) {
            Write-Host 'The owner did not approve the final PR commit.'
            return
          }

          $files = gh api --paginate "$pr/files" --jq '.[] | @json'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the PR files.' }
          $manifest = $files | ForEach-Object { ConvertFrom-Json -InputObject $_ } |
            Where-Object filename -eq 'Cargo.toml'
          $added = [regex]::Matches([string]$manifest.patch, '(?m)^\+version = "(\d+\.\d+\.\d+)"\r?$')
          $removed = [regex]::Matches([string]$manifest.patch, '(?m)^-version = "(\d+\.\d+\.\d+)"\r?$')
          if ($added.Count -ne 1 -or $removed.Count -ne 1 -or
              [version]$added[0].Groups[1].Value -le [version]$removed[0].Groups[1].Value) {
            Write-Host 'The PR did not add a higher workspace version.'
            return
          }
          "tag=$($added[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

  release:
    name: Build and publish the Windows release
    needs: authorize
    if: needs.authorize.outputs.tag != ''
    runs-on: windows-2025
    timeout-minutes: 45
    concurrency:
      group: prism-public-release
      queue: max
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release version and tag
        id: version
        run: |
          .\packaging\check-version.ps1 -ExpectedTag $env:RELEASE_TAG
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not find the latest public release.' }
          if ([version]$env:RELEASE_TAG -le [version]$latest.TrimStart('v')) {
            Write-Host "Version $env:RELEASE_TAG does not exceed the latest release $latest."
            return
          }

          if (git tag --list $env:RELEASE_TAG) {
            $tagCommit = git rev-parse "$env:RELEASE_TAG^{}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:MERGED_COMMIT) {
              throw "Tag $env:RELEASE_TAG already points to another commit."
            }
          } else {
            git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' tag -a $env:RELEASE_TAG -m "Prism $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag.' }
          }
          "previous_tag=$latest" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Bun
        if: steps.version.outputs.previous_tag != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install NSIS and the signer
        if: steps.version.outputs.previous_tag != ''
        run: |
          .\packaging\install-nsis.ps1
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the signer.' }

      - name: Build and sign the installer
        if: steps.version.outputs.previous_tag != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'The Prism updater signing key is missing.' }
          .\packaging\build-installer.ps1

      - name: Publish the signed release
        if: steps.version.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          git -c 'credential.helper=!gh auth git-credential' push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push the release tag.' }

          $notes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:RELEASE_TAG" -f "previous_tag_name=$env:PREVIOUS_TAG" --jq .body
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate release notes.' }
          $notes | Set-Content -LiteralPath "artifacts/Prism_${env:RELEASE_TAG}_release-notes.md" -Encoding utf8
          .\packaging\publish-release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY
