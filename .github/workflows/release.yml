name: Release Prism

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions: {}

jobs:
  authorize:
    name: Authorize the release
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged &&
       github.event.pull_request.merged_by.login == github.repository_owner) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       github.actor == github.repository_owner && github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      commit: ${{ steps.review.outputs.commit }}
    steps:
      - name: Check the owner approval
        id: review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGED_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            "commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
            return
          }

          $pr = "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER"
          $reviews = gh api --paginate "$pr/reviews" --jq '.[] | @json'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the PR reviews.' }
          $review = $reviews | ForEach-Object { ConvertFrom-Json -InputObject $_ } |
            Where-Object { $_.user.login -eq $env:REPOSITORY_OWNER -and $_.state -in @('APPROVED', 'CHANGES_REQUESTED', 'DISMISSED') } |
            Select-Object -Last 1
          if ($null -eq $review -or $review.state -ne 'APPROVED' -or $review.commit_id -ne $env:PR_HEAD) {
            Write-Host 'The owner did not approve the final PR commit.'
            return
          }

          "commit=$env:MERGED_COMMIT" >> $env:GITHUB_OUTPUT

  release:
    name: Build and publish the Windows release
    needs: authorize
    if: needs.authorize.outputs.commit != ''
    runs-on: windows-2025
    timeout-minutes: 45
    concurrency:
      group: prism-public-release
      queue: max
    permissions:
      contents: write
    steps:
      - name: Check out the authorized commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the next release
        id: version
        run: |
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not find the latest public release.' }
          $tag = .\packaging\prepare-release.ps1 -PreviousTag $latest
          if ($tag) {
            "tag=$tag" >> $env:GITHUB_OUTPUT
            "previous_tag=$latest" >> $env:GITHUB_OUTPUT
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Bun
        if: steps.version.outputs.tag != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install NSIS and the signer
        if: steps.version.outputs.tag != ''
        run: |
          .\packaging\install-nsis.ps1
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the signer.' }

      - name: Build and sign the installer
        if: steps.version.outputs.tag != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'The Prism updater signing key is missing.' }
          .\packaging\build-installer.ps1

      - name: Publish the signed release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          git -c 'credential.helper=' -c 'credential.helper=!gh auth git-credential' push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push the release tag.' }

          $notes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:RELEASE_TAG" -f "previous_tag_name=$env:PREVIOUS_TAG" --jq .body
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate release notes.' }
          $notes | Set-Content -LiteralPath "artifacts/Prism_${env:RELEASE_TAG}_release-notes.md" -Encoding utf8
          .\packaging\publish-release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY
