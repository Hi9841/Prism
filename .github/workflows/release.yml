name: Release Prism

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  authorize:
    name: Check the owner review
    if: github.event.pull_request.merged && github.event.pull_request.merged_by.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      approved: ${{ steps.review.outputs.approved }}
    steps:
      - name: Check the latest owner review of the final PR commit
        id: review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          $reviews = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER/reviews"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the PR reviews.' }
          $review = ConvertFrom-Json -InputObject ($reviews -join [Environment]::NewLine) | ForEach-Object { $_ } |
            Where-Object { $_.user.login -eq $env:REPOSITORY_OWNER -and $_.state -in @('APPROVED', 'CHANGES_REQUESTED', 'DISMISSED') } |
            Select-Object -Last 1
          $approved = $null -ne $review -and $review.state -eq 'APPROVED' -and $review.commit_id -eq $env:PR_HEAD
          "approved=$($approved.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $approved) { Write-Host 'The owner did not approve the final PR commit.' }

  release:
    name: Build and publish the Windows release
    needs: authorize
    if: needs.authorize.outputs.approved == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    concurrency:
      group: prism-public-release
      queue: max
    permissions:
      contents: write
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Prepare the versioned source
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previousTag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not find the latest public release.' }
          .\packaging\prepare-release.ps1 -PreviousTag $previousTag

      - name: Install NSIS and the signer
        if: steps.version.outputs.tag != ''
        run: |
          .\packaging\install-nsis.ps1
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the signer.' }

      - name: Build and sign the installer
        if: steps.version.outputs.tag != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'The Prism updater signing key is missing.' }
          .\packaging\build-installer.ps1

      - name: Publish the signed release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          git -c 'credential.helper=!gh auth git-credential' push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push the release tag.' }

          $notes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:RELEASE_TAG" -f "previous_tag_name=$env:PREVIOUS_TAG" --jq .body
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate release notes.' }
          $notes | Set-Content -LiteralPath "artifacts/Prism_${env:RELEASE_TAG}_release-notes.md" -Encoding utf8
          .\packaging\publish-release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY
